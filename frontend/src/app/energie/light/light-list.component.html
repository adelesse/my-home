<div class="lights">
  <p-table [value]="lights()">
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th>On/Off</th>
        <th>Luminosité</th>
        <th>Couleur</th>
      </tr>
    </ng-template>
    <ng-template #body let-light>
      <tr>
        <td>
          @if (light.type.toLowerCase().includes('light')) {
            <span class="pi pi-lightbulb"></span>
          } @else {
            <span class="pi pi-bolt"></span>
          }
          {{ light.name }}
        </td>
        <td>
          @if (light.state.reachable) {
            <p-togglebutton
              [(ngModel)]="light.state.on"
              onLabel="On"
              offLabel="Off"
              class="w-24"
              (onChange)="changeLight(light.id, light.state.on)"
              [disabled]="!light.state.reachable"
            />
          }
        </td>
        <td>
          @if (light.state.reachable && isBrightnessType(light.type)) {
            <p-knob
              [(ngModel)]="light.state.bri"
              [valueColor]="knobColor(light.id)"
              rangeColor="SlateGray"
              [valueTemplate]="brightnessTemplate(light.state.bri)"
              [min]="0"
              [max]="255"
              (onChange)="updateBrightness(light.id, light.state.bri)"
            />
          }
        </td>
        <td>
          @if (light.state.reachable && isColorType(light.type)) {
            <p-colorpicker
              [(ngModel)]="colorValues[light.id]"
              (onHide)="updateColor(light.id, colorValues[light.id])"
              format="rgb"
              appendTo="body"
              inputId="cp-rgb"
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
